<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王子冒险 - 拯救公主</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: linear-gradient(to bottom, #2a2a4a, #1a1a2e);
            border: 3px solid #6a6a8a;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-size: 14px;
            display: none;
            text-shadow: 1px 1px 0 #000;
        }
        
        #shop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .shop-panel {
            background: linear-gradient(to bottom, #3a3a5a, #2a2a4a);
            border: 4px solid #8a8aaa;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #fff;
            max-width: 400px;
        }
        
        .shop-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 2px 2px 0 #000;
        }
        
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        
        .shop-btn {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: 2px solid #1B5E20;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .shop-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        .shop-btn:disabled {
            background: #666;
            border-color: #444;
            cursor: not-allowed;
        }
        
        .close-shop {
            margin-top: 20px;
            background: linear-gradient(to bottom, #f44336, #c62828);
            border: 2px solid #b71c1c;
        }
        
        #level-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffd700;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
        }
        
        #start-screen, #game-over-screen, #victory-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
        }
        
        .screen-title {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
        }
        
        .screen-btn {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: 3px solid #1B5E20;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .screen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.7);
        }
        
        .controls-info {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
        
        #hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-overlay">
            <div>❤️ 生命: <span id="health-display">100</span></div>
            <div>🪙 金币: <span id="gold-display">0</span></div>
            <div>⚔️ 攻击: <span id="attack-display">10</span></div>
            <div>🛡️ 防御: <span id="defense-display">5</div>
        </div>
        
        <div id="level-indicator">关卡: <span id="level-display">1</span>/5</div>
        
        <div id="dialog-box">
            <div id="dialog-text"></div>
        </div>
        
        <div id="shop-overlay">
            <div class="shop-panel">
                <div class="shop-title">🏰 勇者补给站</div>
                <div class="shop-item">
                    <span>💖 生命药水 (+20 HP)</span>
                    <button class="shop-btn" onclick="buyItem('health')" id="btn-health">20🪙</button>
                </div>
                <div class="shop-item">
                    <span>⚔️ 力量之剑 (+5 ATK)</span>
                    <button class="shop-btn" onclick="buyItem('attack')" id="btn-attack">50🪙</button>
                </div>
                <div class="shop-item">
                    <span>🛡️ 守护之盾 (+3 DEF)</span>
                    <button class="shop-btn" onclick="buyItem('defense')" id="btn-defense">40🪙</button>
                </div>
                <div class="shop-item">
                    <span>✨ 全能升级 (+10 HP, +3 ATK, +2 DEF)</span>
                    <button class="shop-btn" onclick="buyItem('all')" id="btn-all">100🪙</button>
                </div>
                <button class="shop-btn close-shop" onclick="closeShop()">继续冒险</button>
            </div>
        </div>
        
        <div id="start-screen">
            <div class="screen-title">👑 王子冒险记</div>
            <div style="font-size: 18px; margin-bottom: 30px; color: #ccc;">拯救被困的公主</div>
            <button class="screen-btn" onclick="startGame()">开始冒险</button>
            <div class="controls-info">
                移动：WASD 或 方向键<br>
                攻击：空格键 或 J键<br>
                互动：E键 或 K键<br>
                目标：击败敌人，收集金币，拯救公主！
            </div>
        </div>
        
        <div id="game-over-screen" class="hidden">
            <div class="screen-title">💀 游戏结束</div>
            <div style="font-size: 18px; margin-bottom: 30px; color: #ccc;">王子倒下了...</div>
            <button class="screen-btn" onclick="restartGame()">重新开始</button>
        </div>
        
        <div id="victory-screen" class="hidden">
            <div class="screen-title">🎉 胜利！</div>
            <div style="font-size: 18px; margin-bottom: 30px; color: #ccc;">王子成功拯救了公主！</div>
            <button class="screen-btn" onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
